<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="飲食日記">
<meta name="theme-color" content="#FF6B35">
<title>飲食日記</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#FF6B35;--primary-dark:#E8551F;--bg:#FFF8F3;--card:#fff;
  --text:#2D2D2D;--muted:#999;--border:#F0E8E0;--radius:16px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;overflow-x:hidden}
/* ── Layout ── */
#app{display:flex;flex-direction:column;min-height:100vh;min-height:-webkit-fill-available}
.top-bar{background:var(--primary);color:#fff;padding:calc(var(--safe-top) + 14px) 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50}
.top-bar h1{font-size:20px;font-weight:700}
.sync-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.sync-btn.syncing .sync-icon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.views{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(80px + var(--safe-bot) + 20px)}
.view{display:none;padding:16px}
.view.active{display:block}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:max(var(--safe-bot),8px);z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.nav-btn{flex:1;background:none;border:none;padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;transition:color .2s}
.nav-btn.active{color:var(--primary)}
.nav-btn svg{width:22px;height:22px}
/* ── Cards ── */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.date-header{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 8px;display:flex;justify-content:space-between}
.date-header span{color:var(--primary);font-weight:700}
.entry-card{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.entry-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#f0ebe6}
.entry-thumb-placeholder{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#f0ebe6,#e8ddd5);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.entry-info{flex:1;min-width:0}
.entry-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.cat-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.entry-time{font-size:12px;color:var(--muted)}
.entry-desc{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.entry-amount{font-size:16px;font-weight:700;color:var(--primary)}
.entry-note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── Category colors ── */
.cat-早餐{background:#FFF3CD;color:#856404}
.cat-午餐{background:#D1F2D1;color:#1A6B1A}
.cat-晚餐{background:#D0E8FF;color:#0055B3}
.cat-點心{background:#FFE0E0;color:#B30000}
.cat-飲料{background:#EFD9FF;color:#6600B3}
.cat-其他{background:#E8E8E8;color:#555}
/* ── Today summary ── */
.today-summary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:var(--radius);padding:20px;margin-bottom:16px;color:#fff}
.today-summary .label{font-size:13px;opacity:.85;margin-bottom:4px}
.today-summary .total{font-size:36px;font-weight:800;margin-bottom:12px}
.today-cats{display:flex;gap:8px;flex-wrap:wrap}
.today-cat-chip{background:rgba(255,255,255,.2);border-radius:10px;padding:4px 10px;font-size:12px}
/* ── FAB ── */
.fab{position:fixed;bottom:calc(80px + max(var(--safe-bot),8px) + 8px);right:20px;width:56px;height:56px;background:var(--primary);color:#fff;border:none;border-radius:50%;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(255,107,53,.45);display:flex;align-items:center;justify-content:center;z-index:99;transition:transform .15s}
.fab:active{transform:scale(.93)}
/* ── Stats ── */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
.stat-card .val{font-size:24px;font-weight:800;color:var(--primary)}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.bar-chart{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:12px}
.bar-chart h3{font-size:15px;font-weight:700;margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;width:36px;text-align:right;color:var(--muted)}
.bar-wrap{flex:1;background:#f0ebe6;border-radius:4px;height:18px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.bar-val{font-size:12px;font-weight:600;width:52px;text-align:right}
/* ── Settings ── */
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.settings-row{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.settings-item:last-child{border-bottom:none}
.settings-item-left{display:flex;align-items:center;gap:12px;font-size:15px}
.settings-item-icon{font-size:20px}
.settings-item-arrow{color:var(--muted);font-size:18px}
.api-display{background:#f5f0eb;border-radius:10px;padding:12px;font-family:monospace;font-size:12px;color:var(--muted);word-break:break-all;margin-top:8px}
/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding:0 0 calc(20px + var(--safe-bot))}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:2px;margin:12px auto 0}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.modal-header h2{font-size:18px;font-weight:700}
.close-btn{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}
.modal-body{padding:0 20px}
.form-group{margin-bottom:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.cat-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-opt{border:2px solid var(--border);background:#fff;border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.cat-opt.selected{border-color:var(--primary);background:#FFF0E8}
input[type=text],input[type=number],input[type=datetime-local],textarea{width:100%;border:2px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;transition:border-color .2s;background:#fff;font-family:inherit}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:none;height:80px}
.photo-upload{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:#fafaf8;transition:border-color .2s}
.photo-upload:hover{border-color:var(--primary)}
.photo-upload input{display:none}
.photo-preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
.photo-preview.show{display:block}
.remove-photo{font-size:12px;color:var(--primary);cursor:pointer;margin-top:6px;display:none}
.remove-photo.show{display:block}
.amount-wrap{position:relative}
.amount-wrap::before{content:'NT$';position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--muted);font-size:15px}
.amount-wrap input{padding-left:46px}
.submit-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .2s}
.submit-btn:active{background:var(--primary-dark)}
/* ── Detail modal ── */
.detail-photo{width:100%;max-height:260px;object-fit:cover;border-radius:16px;margin-bottom:14px}
.detail-cat{display:inline-block;margin-bottom:8px}
.detail-name{font-size:22px;font-weight:800;margin-bottom:6px}
.detail-amount{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:8px}
.detail-meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.detail-note{font-size:14px;color:#555;background:#faf5f0;border-radius:10px;padding:10px 12px;margin-bottom:16px}
.delete-btn{width:100%;background:#FFF0F0;color:#D32F2F;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer}
/* ── Empty states ── */
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:15px}
/* ── Toast ── */
.toast{position:fixed;top:calc(var(--safe-top) + 70px);left:50%;transform:translateX(-50%) translateY(-10px);background:#2D2D2D;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <h1>🍱 飲食日記</h1>
    <button class="sync-btn" onclick="syncNow()">
      <span class="sync-icon">↻</span><span id="sync-label">同步</span>
    </button>
  </div>
  <div class="views">
    <!-- 今天 -->
    <div class="view active" id="view-today">
      <div class="today-summary" id="today-summary"></div>
      <div id="today-list"></div>
    </div>
    <!-- 歷史 -->
    <div class="view" id="view-history">
      <div id="history-list"></div>
    </div>
    <!-- 統計 -->
    <div class="view" id="view-stats">
      <div id="stats-content"></div>
    </div>
    <!-- 設定 -->
    <div class="view" id="view-settings">
      <div class="settings-section">
        <h3>雲端同步</h3>
        <div class="settings-row">
          <div class="settings-item" onclick="syncNow()">
            <div class="settings-item-left"><span class="settings-item-icon">☁️</span>立即同步</div>
            <span class="settings-item-arrow">›</span>
          </div>
          <div class="settings-item" style="cursor:default">
            <div class="settings-item-left"><span class="settings-item-icon">🔑</span>API Key</div>
          </div>
        </div>
        <div class="api-display" id="api-display"></div>
      </div>
      <div class="settings-section">
        <h3>匯出資料</h3>
        <div class="settings-row">
          <div class="settings-item" onclick="exportCSV()">
            <div class="settings-item-left"><span class="settings-item-icon">📊</span>匯出 CSV（Excel）</div>
            <span class="settings-item-arrow">›</span>
          </div>
          <div class="settings-item" onclick="exportJSON()">
            <div class="settings-item-left"><span class="settings-item-icon">📦</span>匯出完整備份 JSON</div>
            <span class="settings-item-arrow">›</span>
          </div>
          <div class="settings-item" onclick="importJSON()">
            <div class="settings-item-left"><span class="settings-item-icon">📥</span>從備份還原</div>
            <span class="settings-item-arrow">›</span>
          </div>
        </div>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">
      </div>
      <div class="settings-section">
        <h3>關於</h3>
        <div class="settings-row">
          <div class="settings-item" style="cursor:default">
            <div class="settings-item-left"><span class="settings-item-icon">ℹ️</span>版本 1.0</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="showView('today',this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>今天
    </button>
    <button class="nav-btn" onclick="showView('history',this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>歷史
    </button>
    <button class="nav-btn" onclick="showView('stats',this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>統計
    </button>
    <button class="nav-btn" onclick="showView('settings',this)">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>設定
    </button>
  </nav>
</div>

<!-- FAB -->
<button class="fab" onclick="openAddModal()" id="fab">＋</button>

<!-- Add Modal -->
<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2>新增記錄</h2>
      <button class="close-btn" onclick="closeAddModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>分類</label>
        <div class="cat-selector" id="cat-selector">
          <div class="cat-opt cat-早餐" onclick="selectCat(this,'早餐')">🌅 早餐</div>
          <div class="cat-opt cat-午餐 selected" onclick="selectCat(this,'午餐')">☀️ 午餐</div>
          <div class="cat-opt cat-晚餐" onclick="selectCat(this,'晚餐')">🌙 晚餐</div>
          <div class="cat-opt cat-點心" onclick="selectCat(this,'點心')">🍰 點心</div>
          <div class="cat-opt cat-飲料" onclick="selectCat(this,'飲料')">🧋 飲料</div>
          <div class="cat-opt cat-其他" onclick="selectCat(this,'其他')">📌 其他</div>
        </div>
      </div>
      <div class="form-group">
        <label>食物名稱</label>
        <input type="text" id="input-name" placeholder="例如：雞腿便當" maxlength="50">
      </div>
      <div class="form-group">
        <label>金額</label>
        <div class="amount-wrap">
          <input type="number" id="input-amount" placeholder="0" min="0" max="99999">
        </div>
      </div>
      <div class="form-group">
        <label>照片</label>
        <div class="photo-upload" onclick="document.getElementById('photo-input').click()">
          <input type="file" id="photo-input" accept="image/*" capture="environment" onchange="handlePhoto(event)">
          <div id="photo-placeholder">📷 點擊拍照或選擇圖片</div>
          <img id="photo-preview" class="photo-preview" alt="預覽">
        </div>
        <div class="remove-photo" id="remove-photo" onclick="removePhoto()">✕ 移除照片</div>
      </div>
      <div class="form-group">
        <label>備註（選填）</label>
        <textarea id="input-note" placeholder="今天的飲食心得..."></textarea>
      </div>
      <div class="form-group">
        <label>時間</label>
        <input type="datetime-local" id="input-time">
      </div>
      <button class="submit-btn" onclick="submitEntry()">✓ 儲存記錄</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h2>飲食記錄</h2>
      <button class="close-btn" onclick="closeDetailModal()">×</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ──
const API_KEY = '$2a$10$0xGf3AE4wnh54szrBcsFKuQ9xZ37jOA4Z/lGBIRSgawQ8P071FCD.';
const BIN_NAME = 'food-diary';
const JSONBIN_URL = 'https://api.jsonbin.io/v3/b';

// ── State ──
let entries = [];
let selectedCat = '午餐';
let selectedPhoto = null;
let currentView = 'today';
let binId = localStorage.getItem('diary_bin_id') || null;

// ── Init ──
document.addEventListener('DOMContentLoaded', async () => {
  loadLocal();
  renderAll();
  document.getElementById('api-display').textContent = API_KEY.slice(0,20) + '••••••••••••••••••••';
  setDefaultTime();
  await syncNow(true);
});

// ── Storage ──
function loadLocal() {
  try {
    const raw = localStorage.getItem('diary_entries');
    entries = raw ? JSON.parse(raw) : [];
  } catch(e) { entries = []; }
}

function saveLocal() {
  localStorage.setItem('diary_entries', JSON.stringify(entries));
}

// ── JSONBin Sync ──
async function syncNow(silent = false) {
  const btn = document.querySelector('.sync-btn');
  btn.classList.add('syncing');
  document.getElementById('sync-label').textContent = '同步中';
  try {
    if (!binId) {
      await createBin();
    } else {
      await pullAndMerge();
      await pushToBin();
    }
    if (!silent) showToast('✓ 同步完成');
  } catch(e) {
    console.error('Sync error:', e);
    if (!silent) showToast('⚠ ' + (e.message || '同步失敗'));
  } finally {
    btn.classList.remove('syncing');
    document.getElementById('sync-label').textContent = '同步';
  }
  renderAll();
}

async function createBin() {
  const res = await fetch(JSONBIN_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': API_KEY,
      'X-Bin-Name': BIN_NAME,
      'X-Bin-Private': 'true'
    },
    body: JSON.stringify({ version: 1, entries })
  });
  if (!res.ok) {
    let msg = '';
    try { const j = await res.json(); msg = j.message || ''; } catch(_) {}
    throw new Error(`建立失敗 (${res.status})${msg ? ': ' + msg : ''}`);
  }
  const data = await res.json();
  binId = data.metadata.id;
  localStorage.setItem('diary_bin_id', binId);
}

async function pullAndMerge() {
  const res = await fetch(`${JSONBIN_URL}/${binId}/latest`, {
    headers: { 'X-Master-Key': API_KEY }
  });
  if (!res.ok) {
    let msg = '';
    try { const j = await res.json(); msg = j.message || ''; } catch(_) {}
    throw new Error(`讀取失敗 (${res.status})${msg ? ': ' + msg : ''}`);
  }
  const data = await res.json();
  const remote = data.record.entries || [];
  // Merge by id
  const map = {};
  entries.forEach(e => map[e.id] = e);
  remote.forEach(e => {
    if (!map[e.id]) map[e.id] = e;
    else if (e.updatedAt > map[e.id].updatedAt) map[e.id] = e;
  });
  entries = Object.values(map).filter(e => !e.deleted);
  saveLocal();
}

async function pushToBin() {
  const res = await fetch(`${JSONBIN_URL}/${binId}`, {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'X-Master-Key': API_KEY
    },
    body: JSON.stringify({ version: 1, entries })
  });
  if (!res.ok) {
    let msg = '';
    try { const j = await res.json(); msg = j.message || ''; } catch(_) {}
    throw new Error(`上傳失敗 (${res.status})${msg ? ': ' + msg : ''}`);
  }
}

// ── Photo ──
async function compressPhoto(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          const r = Math.min(MAX/w, MAX/h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  compressPhoto(file).then(b64 => {
    selectedPhoto = b64;
    const prev = document.getElementById('photo-preview');
    prev.src = b64;
    prev.classList.add('show');
    document.getElementById('photo-placeholder').style.display = 'none';
    document.getElementById('remove-photo').classList.add('show');
  });
}

function removePhoto() {
  selectedPhoto = null;
  document.getElementById('photo-preview').classList.remove('show');
  document.getElementById('photo-placeholder').style.display = '';
  document.getElementById('remove-photo').classList.remove('show');
  document.getElementById('photo-input').value = '';
}

// ── Add Entry ──
function selectCat(el, cat) {
  document.querySelectorAll('.cat-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedCat = cat;
}

function setDefaultTime() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  document.getElementById('input-time').value = local.toISOString().slice(0,16);
}

async function submitEntry() {
  const name = document.getElementById('input-name').value.trim();
  const amount = parseFloat(document.getElementById('input-amount').value) || 0;
  const note = document.getElementById('input-note').value.trim();
  const time = document.getElementById('input-time').value;
  if (!name) { showToast('請輸入食物名稱'); return; }
  const entry = {
    id: Date.now() + Math.random().toString(36).slice(2),
    category: selectedCat,
    name, amount, note,
    photo: selectedPhoto,
    timestamp: time ? new Date(time).toISOString() : new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    deleted: false
  };
  entries.push(entry);
  saveLocal();
  renderAll();
  closeAddModal();
  showToast('✓ 記錄已儲存');
  // Background sync
  setTimeout(() => syncNow(true), 500);
}

async function deleteEntry(id) {
  if (!confirm('確定要刪除這筆記錄嗎？')) return;
  entries = entries.map(e => e.id === id ? {...e, deleted: true, updatedAt: new Date().toISOString()} : e);
  saveLocal();
  renderAll();
  closeDetailModal();
  showToast('已刪除');
  setTimeout(() => syncNow(true), 500);
}

// ── Render ──
function renderAll() {
  renderToday();
  renderHistory();
  renderStats();
}

function getActiveEntries() {
  return entries.filter(e => !e.deleted).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
}

function formatDate(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  if (d.toDateString() === today.toDateString()) return '今天';
  if (d.toDateString() === yest.toDateString()) return '昨天';
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function formatTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function formatAmt(n) { return n ? `NT$ ${n.toLocaleString()}` : 'NT$ 0'; }

function entryCardHTML(e) {
  const thumb = e.photo
    ? `<img class="entry-thumb" src="${e.photo}" alt="">`
    : `<div class="entry-thumb-placeholder">${catEmoji(e.category)}</div>`;
  return `<div class="entry-card card" onclick="openDetail('${e.id}')">
    ${thumb}
    <div class="entry-info">
      <div class="entry-top">
        <span class="cat-badge cat-${e.category}">${e.category}</span>
        <span class="entry-time">${formatTime(e.timestamp)}</span>
      </div>
      <div class="entry-desc">${e.name}</div>
      <div class="entry-amount">${formatAmt(e.amount)}</div>
      ${e.note ? `<div class="entry-note">${e.note}</div>` : ''}
    </div>
  </div>`;
}

function catEmoji(cat) {
  return {早餐:'🌅',午餐:'☀️',晚餐:'🌙',點心:'🍰',飲料:'🧋',其他:'📌'}[cat] || '🍽';
}

function renderToday() {
  const today = new Date().toDateString();
  const todayEntries = getActiveEntries().filter(e => new Date(e.timestamp).toDateString() === today);
  const total = todayEntries.reduce((s,e) => s+e.amount, 0);
  const cats = [...new Set(todayEntries.map(e => e.category))];

  document.getElementById('today-summary').innerHTML = `
    <div class="label">今日飲食花費</div>
    <div class="total">${formatAmt(total)}</div>
    <div class="today-cats">
      ${cats.map(c => `<span class="today-cat-chip">${catEmoji(c)} ${c}</span>`).join('')}
      ${cats.length === 0 ? '<span class="today-cat-chip">尚無記錄</span>' : ''}
    </div>`;

  document.getElementById('today-list').innerHTML = todayEntries.length
    ? todayEntries.map(entryCardHTML).join('')
    : '<div class="empty"><div class="icon">🍽️</div><p>今天還沒有記錄<br>點右下角 ＋ 開始記錄</p></div>';
}

function renderHistory() {
  const all = getActiveEntries();
  if (!all.length) {
    document.getElementById('history-list').innerHTML = '<div class="empty"><div class="icon">📖</div><p>還沒有任何記錄</p></div>';
    return;
  }
  const groups = {};
  all.forEach(e => {
    const d = new Date(e.timestamp).toDateString();
    if (!groups[d]) groups[d] = { label: formatDate(e.timestamp), entries: [], total: 0 };
    groups[d].entries.push(e);
    groups[d].total += e.amount;
  });
  document.getElementById('history-list').innerHTML = Object.values(groups).map(g => `
    <div class="date-header"><span>${g.label}</span><span>${formatAmt(g.total)}</span></div>
    ${g.entries.map(entryCardHTML).join('')}
  `).join('');
}

function renderStats() {
  const all = getActiveEntries();
  const now = new Date();
  const monthEntries = all.filter(e => {
    const d = new Date(e.timestamp);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const monthTotal = monthEntries.reduce((s,e) => s+e.amount, 0);
  const todayTotal = all.filter(e => new Date(e.timestamp).toDateString() === now.toDateString()).reduce((s,e) => s+e.amount, 0);

  // Category breakdown
  const catTotals = {};
  monthEntries.forEach(e => { catTotals[e.category] = (catTotals[e.category]||0) + e.amount; });
  const maxCat = Math.max(...Object.values(catTotals), 1);
  const catColors = {早餐:'#FFD93D',午餐:'#6BCB77',晚餐:'#4D96FF',點心:'#FF6B6B',飲料:'#C77DFF',其他:'#A8B5C1'};

  // Days in month
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const avgPerDay = monthEntries.length ? Math.round(monthTotal / Math.max(now.getDate(), 1)) : 0;

  document.getElementById('stats-content').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="val">${formatAmt(monthTotal)}</div><div class="lbl">本月總花費</div></div>
      <div class="stat-card"><div class="val">${formatAmt(todayTotal)}</div><div class="lbl">今日花費</div></div>
      <div class="stat-card"><div class="val">${formatAmt(avgPerDay)}</div><div class="lbl">每日平均</div></div>
      <div class="stat-card"><div class="val">${monthEntries.length}</div><div class="lbl">本月記錄筆數</div></div>
    </div>
    ${Object.keys(catTotals).length ? `
    <div class="bar-chart">
      <h3>本月分類花費</h3>
      ${Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,amt]) => `
        <div class="bar-row">
          <div class="bar-label">${catEmoji(cat)}</div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(amt/maxCat*100)}%;background:${catColors[cat]||'#ccc'}"></div></div>
          <div class="bar-val">${formatAmt(amt)}</div>
        </div>`).join('')}
    </div>` : ''}
    <div class="empty" style="padding:20px"><p style="font-size:13px;color:var(--muted)">統計基於${now.getMonth()+1}月份資料</p></div>
  `;
}

// ── Modals ──
function openAddModal() {
  document.getElementById('add-modal').classList.add('open');
  setDefaultTime();
  document.getElementById('input-name').focus();
}

function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
  document.getElementById('input-name').value = '';
  document.getElementById('input-amount').value = '';
  document.getElementById('input-note').value = '';
  removePhoto();
  setDefaultTime();
}

function openDetail(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  document.getElementById('detail-body').innerHTML = `
    ${e.photo ? `<img class="detail-photo" src="${e.photo}" alt="">` : `<div style="text-align:center;font-size:64px;margin-bottom:14px">${catEmoji(e.category)}</div>`}
    <span class="cat-badge cat-${e.category} detail-cat">${e.category}</span>
    <div class="detail-name">${e.name}</div>
    <div class="detail-amount">${formatAmt(e.amount)}</div>
    <div class="detail-meta">🕐 ${new Date(e.timestamp).toLocaleString('zh-TW')}</div>
    ${e.note ? `<div class="detail-note">${e.note}</div>` : ''}
    <button class="delete-btn" onclick="deleteEntry('${e.id}')">🗑 刪除這筆記錄</button>
  `;
  document.getElementById('detail-modal').classList.add('open');
}

function closeDetailModal() {
  document.getElementById('detail-modal').classList.remove('open');
}

// Close modal on overlay click
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

// ── Navigation ──
function showView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  btn.classList.add('active');
  currentView = name;
  // Show/hide FAB
  document.getElementById('fab').style.display = (name === 'stats' || name === 'settings') ? 'none' : 'flex';
}

// ── Export ──
function exportCSV() {
  const all = getActiveEntries();
  const rows = [['日期','時間','分類','食物名稱','金額(NT$)','備註']];
  all.forEach(e => {
    const d = new Date(e.timestamp);
    rows.push([
      `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
      `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,
      e.category, e.name, e.amount, e.note || ''
    ]);
  });
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download(new Blob([csv], {type:'text/csv;charset=utf-8'}), `飲食日記_${today()}.csv`);
  showToast('✓ CSV 已下載');
}

function exportJSON() {
  const data = { version:1, exportedAt: new Date().toISOString(), entries: getActiveEntries() };
  download(new Blob([JSON.stringify(data,null,2)], {type:'application/json'}), `飲食日記備份_${today()}.json`);
  showToast('✓ JSON 備份已下載');
}

function importJSON() { document.getElementById('import-file').click(); }

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const imported = (data.entries || data).filter(e => e.id && e.name);
      const map = {};
      entries.forEach(e => map[e.id] = e);
      imported.forEach(e => { if (!map[e.id]) map[e.id] = e; });
      entries = Object.values(map).filter(e => !e.deleted);
      saveLocal();
      renderAll();
      showToast(`✓ 已匯入 ${imported.length} 筆記錄`);
      setTimeout(() => syncNow(true), 1000);
    } catch { showToast('⚠ 檔案格式錯誤'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}
</script>
